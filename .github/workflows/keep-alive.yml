name: Keep Render awake

on:
  schedule:
    # Render free instances sleep after 15 minutes idle. Four 5h50m jobs
    # cover the day with a 10-minute ping cadence and stay under the
    # 2,000 free Actions minutes for private repos (a separate run every
    # 10 minutes would bill ~4,320 minutes/month).
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping /health every 10 minutes
        run: |
          url="https://stremio-cb-addon.onrender.com/health"
          end=$(( $(date +%s) + 21000 ))
          failures=0

          while [ "$(date +%s)" -lt "$end" ]; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "$url" || true)
            if [ "$code" = "200" ]; then
              failures=0
              echo "$(date -u +%FT%TZ) ping ok"
            else
              failures=$((failures + 1))
              echo "$(date -u +%FT%TZ) ping failed (HTTP ${code:-none}, consecutive $failures)"
              if [ "$failures" -ge 3 ]; then
                echo "Render unreachable for 3 consecutive pings"
                exit 1
              fi
            fi

            remaining=$(( end - $(date +%s) ))
            [ "$remaining" -gt 0 ] || break
            if [ "$remaining" -gt 600 ]; then remaining=600; fi
            sleep "$remaining"
          done
