name: Sync upstream providers

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Vendor latest upstream providers
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf /tmp/upstream
            if git clone --depth 1 https://github.com/SA7ANI/cb-providers.git /tmp/upstream; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::failed to clone upstream after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 2))
            echo "clone failed; retrying in ${delay}s"
            sleep "$delay"
          done
          rm -rf vendor/cb-providers/providers
          mkdir -p vendor/cb-providers
          cp -R /tmp/upstream/providers vendor/cb-providers/providers
          cp /tmp/upstream/manifest.json vendor/cb-providers/manifest.json
          cp /tmp/upstream/LICENSE vendor/cb-providers/LICENSE
          git -C /tmp/upstream rev-parse HEAD > vendor/cb-providers/UPSTREAM_COMMIT

      - name: Verify provider set
        run: |
          npm ci
          for f in *.js; do node --check "$f"; done
          npm run verify

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/cb-providers
          if git diff --cached --quiet; then
            echo "Already up to date"
            exit 0
          fi
          git commit -m "chore: sync providers from upstream ($(date -u +%F))"
          git push
