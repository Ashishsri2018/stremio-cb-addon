services:
  - type: web
    name: stremio-cb-addon
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PROVIDER_TIMEOUT_MS
        value: "20000"
      - key: ADDON_DEADLINE_MS
        value: "25000"
      - key: TMDB_API_KEY
        sync: false
